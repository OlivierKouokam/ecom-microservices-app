apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      initContainers:
      - name: wait-for-config-service
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -v -w3 config-service 8888; do echo "En attente du Config Server..."; sleep 2; done;']
      containers:
      - name: inventory-service
        image: olivierkkoc/ecom-inventory-service:latest
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-service:8888/"
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        # - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        #   value: "http://discovery-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8082
      targetPort: 8082