apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      initContainers:
      - name: wait-for-config-service
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -v -w3 config-service 8888; do echo "En attente du Config Server..."; sleep 2; done;']
      containers:
      - name: gateway-service
        image: olivierkkoc/ecom-gateway-service:latest
        ports:
        - containerPort: 9999
        env:
        - name: SPRING_CONFIG_IMPORT
          value: "optional:configserver:http://config-service:8888/"
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        # - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        #   value: "http://discovery-service:8761/eureka/"
        # Désactivation explicite du client Eureka
        - name: EUREKA_CLIENT_ENABLED
          value: "false"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "false"
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "false"
        # Définition des routes statiques pointant vers les DNS de tes Services K8s
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
          value: "customer-route"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
          value: "http://customer-service:8081"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
          value: "Path=/customers/**"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
          value: "inventory-route"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
          value: "http://inventory-service:8082"
        - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
          value: "Path=/products/**"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 9999
      targetPort: 9999
      nodePort: 30099